<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perspecta - Learning to Draw</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            outline: none;
            max-width: 100%;
            max-height: 100vh;
        }
        #loading {
            color: white;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Perspecta...</div>
    <script type="module">
        import init from './perspecta.js';

        init().then(() => {
            document.getElementById('loading').style.display = 'none';
        }).catch((error) => {
            document.getElementById('loading').innerText = 'Error loading application: ' + error;
        });
    </script>
</body>
</html>
